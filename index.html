<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOMAN ROSTER - COMMAND SYSTEM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
  
  /* नया बैकग्राउंड इमेज और डार्क ओवरले */
  body { 
    background-image: linear-gradient(rgba(0, 5, 15, 0.7), rgba(0, 10, 20, 0.85)), url('1000054293.webp');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    color: #fff; 
    padding: 15px; 
    min-height: 100vh; 
  }
  
  .container { max-width: 550px; margin: 0 auto; text-align: center; }
  
  /* नियॉन ब्लू टाइटल (इमेज से मैच करता हुआ) */
  .title { font-size: 26px; font-weight: 900; color: #00f3ff; letter-spacing: 4px; margin-bottom: 2px; text-shadow: 0 0 15px rgba(0, 243, 255, 0.8); }
  .sub-title { font-size: 11px; color: #a0e8ff; letter-spacing: 2px; font-weight: bold; margin-bottom: 20px; text-transform: uppercase; }

  /* ट्रांसपेरेंट कार्ड टेबल */
  .card-table { background: rgba(10, 15, 25, 0.85); border: 2px solid #00f3ff; border-radius: 12px; overflow: hidden; box-shadow: 0 0 30px rgba(0, 243, 255, 0.3); margin-bottom: 25px; backdrop-filter: blur(4px); }
  table { width: 100%; border-collapse: collapse; }
  th { background: linear-gradient(90deg, #001a33, #000b1a); color: #00f3ff; padding: 14px 8px; font-size: 12px; border-bottom: 1px solid #00f3ff; text-transform: uppercase; letter-spacing: 1px; }
  td { padding: 14px 8px; font-size: 13px; border-bottom: 1px solid #223; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }

  .name-col { color: #fff; font-weight: bold; font-size: 14px; text-shadow: 0 0 5px rgba(255,255,255,0.3); }
  .deed-badge { display: inline-block; background: rgba(0, 243, 255, 0.1); color: #00f3ff; border: 1px solid #00f3ff; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; box-shadow: 0 0 8px rgba(0, 243, 255, 0.2); }

  /* एक्शन बटन्स */
  .action-btns { display: flex; gap: 8px; justify-content: center; }
  .btn-action { padding: 6px 10px; border: none; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: bold; transition: 0.3s; }
  .btn-edit { background: #00f3ff; color: #000; box-shadow: 0 0 10px rgba(0, 243, 255, 0.4); }
  .btn-del { background: #ff3366; color: #fff; box-shadow: 0 0 10px rgba(255, 51, 102, 0.4); }

  /* एडमिन पैनल */
  .admin-box { background: rgba(0, 0, 0, 0.7); border: 1px solid #00f3ff; border-radius: 10px; padding: 15px; margin-top: 15px; box-shadow: 0 0 20px rgba(0, 243, 255, 0.2); backdrop-filter: blur(5px); }
  .admin-header { font-size: 14px; color: #00f3ff; font-weight: bold; margin-bottom: 15px; letter-spacing: 1px; text-shadow: 0 0 5px rgba(0, 243, 255, 0.5); }
  
  input { width: 100%; padding: 12px; margin-bottom: 12px; background: rgba(20, 25, 35, 0.9); border: 1px solid #00f3ff; border-radius: 6px; color: #fff; font-size: 14px; }
  input:focus { outline: none; box-shadow: 0 0 10px rgba(0, 243, 255, 0.5); }

  .btn-submit { width: 100%; padding: 12px; background: linear-gradient(90deg, #00f3ff, #0088ff); border: none; border-radius: 6px; color: #000; font-weight: 900; font-size: 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 0 15px rgba(0, 243, 255, 0.5); }
  .btn-lock { background: rgba(0,0,0,0.5); border: 1px solid #00f3ff; color: #00f3ff; font-size: 12px; padding: 8px 15px; border-radius: 4px; margin-top: 15px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
  <div class="title">TOMAN GANG</div>
  <div class="sub-title">HQ REGISTRY & COMMAND PANEL</div>

  <div class="card-table">
    <table>
      <thead>
        <tr>
          <th>मेंबर नाम (Name)</th>
          <th>पद व कार्य (Role / Deeds)</th>
          <th id="actHeader" style="display:none;">एक्शन</th>
        </tr>
      </thead>
      <tbody id="memberList">
        <!-- Records load dynamically -->
      </tbody>
    </table>
  </div>

  <div id="loginArea">
    <button class="btn-lock" onclick="promptLogin()">🔒 ADMIN LOGIN</button>
  </div>

  <div id="adminArea" class="admin-box" style="display:none;">
    <div class="admin-header">⚡ ADMIN PANEL - EDIT RECORDS ⚡</div>
    <input type="hidden" id="editIndex" value="-1">
    <input type="text" id="mName" placeholder="मेंबर का नाम (Member Name)">
    <input type="text" id="mDeeds" placeholder="पद या काम (Role / Performance)">
    <button class="btn-submit" id="saveBtn" onclick="saveRecord()">UPDATE / ADD RECORD</button>
    <br>
    <button class="btn-lock" onclick="logoutAdmin()" style="border-color: #ff3366; color: #ff3366;">🔓 LOGOUT ADMIN</button>
  </div>
</div>

<script>
  let defaultData = [
    { name: "Ishan Kumar Gupta", deeds: "Vice President / Supreme Active" },
    { name: "Anshu", deeds: "President / Commander" }
  ];

  let members = JSON.parse(localStorage.getItem("toman_records")) || defaultData;
  let isAdmin = false;

  function renderTable() {
    const tbody = document.getElementById("memberList");
    tbody.innerHTML = "";
    members.forEach((m, index) => {
      let row = `<tr>
        <td class="name-col">${m.name}</td>
        <td><span class="deed-badge">${m.deeds}</span></td>
        ${isAdmin ? `<td>
          <div class="action-btns">
            <button class="btn-action btn-edit" onclick="startEdit(${index})">✏️</button>
            <button class="btn-action btn-del" onclick="deleteMember(${index})">🗑️</button>
          </div>
        </td>` : ''}
      </tr>`;
      tbody.innerHTML += row;
    });
    document.getElementById("actHeader").style.display = isAdmin ? "" : "none";
  }

  function promptLogin() {
    let pwd = prompt("एडमिन पासवर्ड दर्ज करें:");
    if (pwd === "TOMAN DARK" || pwd === "270209") { 
      isAdmin = true;
      document.getElementById("adminArea").style.display = "block";
      document.getElementById("loginArea").style.display = "none";
      renderTable();
    } else {
      alert("गलत पासवर्ड! एक्सेस डिनाइड।");
    }
  }

  function logoutAdmin() {
    isAdmin = false;
    document.getElementById("adminArea").style.display = "none";
    document.getElementById("loginArea").style.display = "block";
    resetForm();
    renderTable();
  }

  function saveRecord() {
    let name = document.getElementById("mName").value.trim();
    let deeds = document.getElementById("mDeeds").value.trim();
    let editIdx = parseInt(document.getElementById("editIndex").value);

    if (!name || !deeds) {
      alert("कृपया नाम और काम दोनों भरें!");
      return;
    }

    // अगर हम किसी को एडिट कर रहे हैं, तो उसका पुराना डेटा इस नए डेटा से बदल जाएगा
    if (editIdx > -1) {
      members[editIdx] = { name, deeds };
    } else {
      members.push({ name, deeds });
    }

    localStorage.setItem("toman_records", JSON.stringify(members));
    resetForm();
    renderTable();
  }

  function startEdit(index) {
    document.getElementById("editIndex").value = index;
    document.getElementById("mName").value = members[index].name;
    document.getElementById("mDeeds").value = members[index].deeds;
    document.getElementById("saveBtn").innerText = "SAVE CHANGES (सेव करें)";
  }

  function deleteMember(index) {
    if (confirm("क्या आप सच में इस सदस्य को हटाना चाहते हैं?")) {
      members.splice(index, 1);
      localStorage.setItem("toman_records", JSON.stringify(members));
      renderTable();
    }
  }

  function resetForm() {
    document.getElementById("editIndex").value = "-1";
    document.getElementById("mName").value = "";
    document.getElementById("mDeeds").value = "";
    document.getElementById("saveBtn").innerText = "UPDATE / ADD RECORD";
  }

  renderTable();
</script>

</body>
</html>
